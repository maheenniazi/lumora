services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  lumora:
    build: .
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Only needed for the "generate notes" feature
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./saved_notes:/app/saved_notes

volumes:
  ollama_models:
